# 公开发布用的无密钥配置模板。请勿在此文件中填写真实 API Key；优先使用 OPENAI_API_KEY 环境变量。
# 运行中的 MaiBot 配置请勿从用户数据目录复制回此仓库。

[plugin]
enabled = true
enable_tool = true
enable_commands = true
config_version = "1.1.0"

[api]
base_url = "https://api.openai.com/v1"
api_key = ""
api_key_env = "OPENAI_API_KEY"
model = "gpt-image-2"
generations_path = "/images/generations"
edits_path = "/images/edits"
timeout_seconds = 300.0

[identity]
enabled = true
character_name = "麦麦"
reference_policy = "fixed_only"
reference_filename = "bot-face.png"
force_for_bot_images = true
fail_if_missing = true
bot_aliases = ["你", "麦麦", "MaiBot", "bot"]
lock_face = true
lock_hair = true
lock_eye_color = true
lock_apparent_age = true

[auto_trigger]
enabled = true
planner_model = "planner"
semantic_threshold = 0.80
max_pending_per_chat = 2
reply_wait_seconds = 12.0
dedupe_seconds = 90.0

[context]
enabled = true
message_limit = 16
max_chars = 8000
hours = 4.0
include_reply = true
include_previous_prompt = true
include_image_descriptions = true

[prompt]
model = "planner"
temperature = 0.2
max_tokens = 1500
join_mode = "smart_merge"
language = "zh-CN"
show_final_prompt = false
fallback_to_template = true
# 默认让未指定冲突画风的图片更像真实日常随手拍。
everyday_photo_defaults = true
default_style = "写实生活摄影，像朋友在日常生活中用手机随手拍到的真实照片；保留自然皮肤纹理、细小瑕疵、衣物褶皱和普通生活环境，不过度磨皮、精修或美化"
default_composition = "普通手机或消费级相机的自然视角，手持拍摄，构图放松且略有不完美；主体与周围环境关系真实，不刻意居中对称，不采用广告式摆拍"
default_lighting = "使用场景中实际存在的自然光或普通环境光；曝光、白平衡和阴影符合现场，允许轻微明暗不均，避免夸张轮廓光和影棚布光"
default_negative = ["文字", "水印", "面部畸变", "肢体畸变", "多余手指", "塑料皮肤", "过度磨皮", "过度锐化", "HDR 过重", "夸张背景虚化", "影楼写真", "商业广告大片", "时尚杂志硬照", "电影剧照感", "CGI", "3D 渲染感", "插画感", "刻意摆拍", "过分对称构图"]

[generation]
size = "1024x1536"
quality = "high"
output_format = "png"
background = "auto"
moderation = "auto"
max_outputs = 1
max_reference_images = 2

[behavior]
reference_image_max_age_seconds = 900
max_cached_images = 8
max_concurrency = 2
skip_when_busy = true
dedupe_seconds = 90
send_error_messages = true
include_tool_media = true

[network]
max_retries = 2
max_input_bytes = 20971520
max_output_bytes = 52428800
verify_ssl = true
block_private_networks = true
allowed_image_hosts = []

